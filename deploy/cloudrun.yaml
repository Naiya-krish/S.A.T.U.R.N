# ── Cloud Run service definition ────────────────────────────────────────────
# Deploy with:
#   gcloud run services replace deploy/cloudrun.yaml --region us-central1
#
# Before that, create the FIRMS secret (see docs/DEPLOYMENT.md):
#   gcloud secrets create firms-map-key --data-file=- <<< "YOUR_KEY"

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: saturn-api
  labels:
    app: saturn
    managed-by: manual
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "4"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      serviceAccountName: saturn-run@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - name: saturn-api
          image: us-central1-docker.pkg.dev/PROJECT_ID/saturn/saturn-api:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: SATURN_ENV
              value: production
            - name: BACKEND_HOST
              value: 0.0.0.0
            - name: BACKEND_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: INFO
            # Vertex AI — Application Default Credentials from the service account.
            - name: GOOGLE_CLOUD_PROJECT
              value: PROJECT_ID
            - name: GOOGLE_CLOUD_LOCATION
              value: us-central1
            - name: VERTEX_MODEL
              value: gemini-2.5-flash
            # Production CORS: the Firebase Hosting origin only.
            - name: CORS_ORIGINS
              value: https://PROJECT_ID.web.app,https://PROJECT_ID.firebaseapp.com
            # OSM policy requires a real contact address in the User-Agent.
            - name: NOMINATIM_USER_AGENT
              value: saturn-geoai/1.0 (+https://PROJECT_ID.web.app; ops@example.com)
            - name: FIRMS_MAP_KEY
              valueFrom:
                secretKeyRef:
                  name: firms-map-key
                  key: latest
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 30
